# api DNMP 本地配置示例。

# go-zero HTTP 基础配置。
# 服务名称，用于日志、监控和服务标识。
Name: "api"
# HTTP 服务监听地址。
Host: "0.0.0.0"
# HTTP 服务监听端口。
Port: 8890
# 服务环境：dev / test / rt / pre / pro。
Mode: "dev"
# HTTP 接口统一响应超时，单位毫秒。
Timeout: 30000
# HTTP 请求体最大字节数。
MaxBytes: 10485760

# DNMP 开发环境内网接口独立监听器；端口只应在容器网络内暴露。
internal_server:
  # 内网路由监听 IP；DNMP 使用容器通配地址，生产禁止通配地址，变更后必须重启。
  host: "0.0.0.0"
  # 内网路由监听端口，取值 1-65535 且不能与公网 Port 相同，变更后必须重启。
  port: 8891
  # mTLS 服务端证书文件；与 key_file、client_ca_file 同时为空或同时配置，DNMP 容器内 HTTP 可留空，变更后必须重启。
  cert_file: ""
  # mTLS 服务端私钥文件；必须与 cert_file、client_ca_file 成组配置，文件内容不得写入 YAML 或日志，变更后必须重启。
  key_file: ""
  # mTLS 客户端 CA 文件；配置后内网监听器强制校验客户端证书，必须与 cert_file、key_file 成组配置，变更后必须重启。
  client_ca_file: ""

# 站点/应用 ID，用于 Redis Key 命名空间。
app_id: "1"
# 应用密钥仅供本地示例使用，部署前必须替换。
app_key: "dnmp-local-app-key-please-change"
# 当前实例 ID，本地固定便于日志排查。
instance_id: "local-api-1"
# 可信反向代理 IP/CIDR；空列表仅信任本机回环代理。
trusted_proxies: []

# 基于 github.com/bwmarrin/snowflake 的分布式雪花 ID；多实例通过 Redis 租约自动分配 node_id。
snowflake:
  # Redis node_id 租约配置；生产多实例建议开启。
  redis:
    # 是否启用 Redis 租约自动分配 node_id。
    enabled: true
    # node_id 租约作用域；同一套 api/admin 部署必须一致。
    scope: "main"
    # node_id 租约 TTL，单位秒。
    lease_seconds: 120 # 允许 10-86400 秒。
    # node_id 租约续期间隔，单位秒，必须小于 lease_seconds 的一半。
    renew_interval_seconds: 30
    # 按业务 namespace 限制可竞争 node_id 池大小；未配置时使用完整 0-1023。
    namespaces:
      # 用户 ID 生成统一限制为 10 个 node_id；api/admin 写同一用户表必须一致。
      user:
        # 当前 namespace 可竞争的 node_id 数量，取值 1-1024；0 表示完整池。
        node_count: 10
  # 高吞吐业务可按 namespace 启用 Redis Segment 本地号段；默认关闭，普通业务继续走雪花。
  segment:
    # 是否启用 Redis Segment 本地号段策略。
    enabled: false
    # Segment 高水位作用域，默认与 snowflake.redis.scope 保持一致。
    scope: "main"
    # Redis 申请号段超时时间，单位秒。
    allocate_timeout_seconds: 2
    # 按业务 namespace 配置号段策略；空对象表示未启用具体业务。
    namespaces: {}
    # 示例：
    # namespaces:
    #   recharge.order:
    #     # 是否让该业务 namespace 使用 Redis Segment。
    #     enabled: true
    #     # 每次从 Redis 申请的号段长度。
    #     step: 10000
    #     # 本地剩余号段低于该阈值时预取下一段。
    #     prefetch_threshold: 2000
    #     # Redis 高水位初始化值；0 表示首个 ID 从 1 开始。
    #     start: 0

# 业务用户物理表路由配置。
user:
  # 当前用户物理表数量，仅支持 1/2/4/.../1024；Admin/API 必须保持一致。
  route_shard_count: 1

# JWT 密钥仅供本地示例使用，部署前必须替换。
jwt_secret: "please-change-this-jwt-secret"
# JWT 过期时间，单位秒。
jwt_expires_in: 86400

# 本地默认开启配置热加载，修改运行期配置后无需重启即可生效。
hot_reload:
  # 是否启用配置热加载。
  enabled: true
  # 配置文件轮询间隔，单位秒。
  check_interval_seconds: 5

# 可选外部配置入口，留空时只读取 -f 指定的主配置。
config_files:
  # 运行期配置文件路径。
  runtime: ""

# 前台认证配置。
auth:
  # 是否开放注册接口，本地默认开启。
  register_enabled: true
  # JWT iss 签发方；空值回退顶层 name，签发与验签必须一致，修改后重启进程。
  issuer: "api"
  # Redis 会话 TTL；<=0 或超过 jwt_expires_in 时使用 jwt_expires_in。
  session_ttl_seconds: 86400
  # 用户资料缓存 TTL。
  profile_cache_ttl_seconds: 300
  # 密码最小长度。
  password_min_length: 8
  # 登录入口限流，按 IP 和用户名分别计数。
  login_rate_limit:
    # 是否启用登录限流。
    enabled: true
    # 限流统计窗口，单位秒。
    window_seconds: 60
    # 窗口内最大失败次数。
    max_attempts: 10
    # 命中限流后的锁定时间，单位秒。
    lock_seconds: 120
  # 注册入口限流，按 IP 计数。
  register_rate_limit:
    # 是否启用注册限流。
    enabled: true
    # 限流统计窗口，单位秒。
    window_seconds: 60
    # 窗口内最大尝试次数。
    max_attempts: 5
    # 命中限流后的锁定时间，单位秒。
    lock_seconds: 180

# 本地日志配置。
log:
  # 日志级别：debug / info / warn / error。
  level: "debug"
  # 输出模式：console / file。
  mode: "console"
  # 编码格式：plain / json。
  encoding: "plain"

# 可观测性配置。
observability:
  # 可观测性服务名。
  service_name: "api"
  # 是否启用 trace 上报。
  trace_enabled: true
  # OTLP 上报协议：grpc/http-protobuf；为空默认 grpc。
  otlp_protocol: "grpc"
  # OTLP 上报地址；为空表示不上报到外部 collector。
  otlp_endpoint: ""
  # 是否使用明文连接 OTLP。
  otlp_insecure: true
  # trace 采样率，0~1。
  sample_ratio: 1
  # 慢 SQL 阈值，单位毫秒。
  slow_sql_ms: 300
  # 慢 Redis 阈值，单位毫秒。
  redis_slow_ms: 80
  # 请求/审计日志中请求体最大保留字节数。
  log_body_max_bytes: 4096

# 外部运行异常告警，当前支持 Lark 群机器人。
alert:
  # Lark 群机器人告警配置。
  lark:
    # 是否启用 Lark 告警。
    enabled: false
    # Lark webhook URL；为空时读取 webhook_url_ref。
    webhook_url: ""
    # Lark webhook URL 文件路径。
    webhook_url_ref: ""
    # Lark 签名密钥；为空时读取 secret_ref。
    secret: ""
    # Lark 签名密钥文件路径。
    secret_ref: ""
    # HTTP 请求超时，单位秒。
    timeout_seconds: 5
    # 是否在告警中 @所有人。
    at_all: false
    # 错误摘要最大字节数。
    max_error_bytes: 800

# 签名验签和加解密配置。未配置密钥时按普通请求处理；配置后启动期会校验版本路由和 AES/RSA 材料。
security:
  # 空对象表示关闭签名验签和加解密。
  secret_key: {}
# 启用示例：
# security:
#   secret_key:
#     # 密钥版本，对应 X-Key-Version。
#     key_version: "v1"
#     # 签名验签状态：1启用，0停用；与加密解密开关独立。
#     sign_status: 1
#     # 加密解密状态：1启用，0停用；与签名验签开关独立。
#     crypto_status: 1
#     # stable_version: "v1"
#     # gray_version: "v2"
#     # gray_percent: 10
#     # gray_salt: "local-gray-salt"
#     aes_key_ref: "./etc/secrets/aes_key"
#     aes_iv_ref: "./etc/secrets/aes_iv"
#     rsa_public_key_user_ref: "./etc/secrets/rsa_public_key_user.pem"
#     rsa_private_key_server_ref: "./etc/secrets/rsa_private_key_server.pem"

# 通用收集器；API 只负责把结构化事件投递到 Kafka，Admin Worker 负责消费闭环。
collector:
  # DNMP 默认启用，用于联调真实认证风控链路。
  enabled: true
  # Kafka 正常链路配置。
  kafka:
    # Kafka broker 地址列表。
    brokers:
      - "127.0.0.1:29092"
    # Producer 写入批次大小，不表示业务批处理触发规则。
    write_batch_size: 500
    # Producer 写入批次等待时间，单位毫秒；业务批处理规则在消费端配置。
    write_batch_wait_milliseconds: 20
    # Producer 写入超时时间，单位秒。
    write_timeout: 3
  # 按 bizType 显式配置投递 Topic；key 必须等于 Event.BizType。
  tasks:
    # 前台认证风控事件。
    auth.security:
      # 固定 Kafka Topic，必须与 Admin auth.security 消费任务一致。
      topic: "api_collector_auth_security_events"

# 运维级接口保护；本地内网接口校验 token、时间戳、随机 nonce、请求体摘要和 HMAC。
ops:
  # 本地运维令牌，对应请求头 X-Ops-Token 和 HMAC 密钥。
  config_reload_token: "dnmp-local-ops-token"
  # 运维接口允许的 IP 或 CIDR 白名单。
  config_reload_allowed_ips:
    - "127.0.0.1"
    - "::1"

# 本地 MySQL 读写分离配置。
mysql:
  # 主库 DSN。
  write_data_source: "root:password@tcp(127.0.0.1:3307)/api?charset=utf8mb4&parseTime=true&loc=Local"
  # 读库 DSN 列表；不需要读写分离时留空。
  read_data_sources:
    - "root:password@tcp(127.0.0.1:3308)/api?charset=utf8mb4&parseTime=true&loc=Local"
  # 最大打开连接数。
  max_open_conns: 20
  # 最大空闲连接数。
  max_idle_conns: 10
  # 单个连接最大存活时间，单位秒。
  conn_max_lifetime: 300
  # 是否开启 SQL 调试日志。
  debug: false

# 本地 Redis Cluster 配置。
redis:
  # Redis 模式：single=单节点，cluster=集群。
  type: "cluster"
  # Redis 节点地址列表；单机填 1 个，集群可填多个。
  addrs:
    - "127.0.0.1:7001"
    - "127.0.0.1:7002"
    - "127.0.0.1:7003"
    - "127.0.0.1:7004"
    - "127.0.0.1:7005"
    - "127.0.0.1:7006"
  # Redis Cluster 地址改写表；key 为唯一的节点公告主机名，value 为当前进程可达主机/IP，条目顺序无意义；空表不改写，仅 cluster 模式允许配置，且不参与运行期热加载。
  addr_map:
    redis-cluster-7001: "127.0.0.1"
    redis-cluster-7002: "127.0.0.1"
    redis-cluster-7003: "127.0.0.1"
    redis-cluster-7004: "127.0.0.1"
    redis-cluster-7005: "127.0.0.1"
    redis-cluster-7006: "127.0.0.1"
  # Redis 认证密码；无密码可留空。
  password: ""
  # Redis DB 编号；Cluster 模式通常固定为 0。
  db: 0
  # Redis 连接池大小。
  pool_size: 20
