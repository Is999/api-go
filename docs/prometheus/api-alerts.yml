groups:
  - name: api
    rules:
      - alert: GozeroApiSecurityConfigEvents
        expr: sum by (app_id, reason) (rate(api_auth_security_events_total{category="security_config"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "api security config error"
          description: "app_id={{ $labels.app_id }} reason={{ $labels.reason }} has security_config events."

      - alert: GozeroApiSecurityFailedSpike
        expr: sum by (app_id, reason) (rate(api_auth_security_events_total{action="security_failed"}[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "api security failures increased"
          description: "app_id={{ $labels.app_id }} reason={{ $labels.reason }} has more than 5 security failures per second."

      - alert: GozeroApiCollectorEnqueueFailed
        expr: sum by (transport) (rate(api_collector_enqueue_events_total{result!="success"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "api Collector enqueue failed"
          description: "Collector transport={{ $labels.transport }} has enqueue failures."

      - alert: GozeroApiCollectorProcessorFailed
        expr: sum by (biz_type) (rate(api_collector_processor_batch_duration_seconds_count{result="failed"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "api Collector processor failed"
          description: "Collector biz_type={{ $labels.biz_type }} has failed processor batches."

      - alert: GozeroApiIDGenerateFailed
        expr: sum by (job, instance, biz_type, strategy) (rate(api_idgen_generated_total{result!="success"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "api ID generation failed"
          description: "instance={{ $labels.instance }} ID biz_type={{ $labels.biz_type }} strategy={{ $labels.strategy }} has generation failures."

      - alert: GozeroApiIDSegmentRemainingLow
        expr: (api_idgen_segment_remaining < 100) and on (job, instance, biz_type) (sum by (job, instance, biz_type) (rate(api_idgen_generated_total{strategy="segment",result="success"}[10m])) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "api ID Segment local range is low"
          description: "instance={{ $labels.instance }} ID Segment biz_type={{ $labels.biz_type }} local range is below 100 while still generating IDs."

      - alert: GozeroApiSnowflakeLeaseLost
        expr: sum by (job, instance, biz_type, event) (rate(api_idgen_snowflake_lease_events_total{event=~"lost|renew_timeout"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "api Snowflake lease lost"
          description: "instance={{ $labels.instance }} Snowflake biz_type={{ $labels.biz_type }} event={{ $labels.event }} detected."
